[alembic]
script_location = migrations
prepend_sys_path = .:apps/api:packages/domain:packages/db:packages/retrieval
path_separator = os
sqlalchemy.url = postgresql+psycopg://noemosyne:noemosyne@localhost:5432/noemosyne

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
